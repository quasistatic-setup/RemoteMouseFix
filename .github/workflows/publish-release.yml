name: Publish versioned Windows release

on:
  push:
    branches: [main]
    paths:
      - CMakeLists.txt
      - .github/workflows/publish-release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    name: Build, test and publish versioned release
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Read version and check existing release
        id: release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $text = Get-Content CMakeLists.txt -Raw
          $match = [regex]::Match($text, '(?s)project\(RemoteMouseFix\s+VERSION\s+(\d+\.\d+\.\d+)')
          if (-not $match.Success) { throw 'Cannot read RemoteMouseFix version from CMakeLists.txt' }
          $version = $match.Groups[1].Value
          $tag = "v$version"
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          # A release is immutable for this workflow. Re-running never
          # overwrites an existing release or retags an older version.
          $PSNativeCommandUseErrorActionPreference = $false
          gh release view $tag --repo $env:GITHUB_REPOSITORY --json tagName 2>$null | Out-Null
          $exists = ($LASTEXITCODE -eq 0)
          "exists=$($exists.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          Write-Host "Release $tag exists=$exists"
          # gh returns code 1 for a release that does not yet exist. That is
          # expected here; don't let the shell treat it as a failed step.
          exit 0

      - name: Configure x64 MSVC with warnings as errors
        if: steps.release.outputs.exists == 'false'
        run: cmake -S . -B build -A x64 -DCMAKE_CXX_FLAGS="/WX"

      - name: Build release
        if: steps.release.outputs.exists == 'false'
        run: cmake --build build --config Release

      - name: Regression tests
        if: steps.release.outputs.exists == 'false'
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Stage release including MouseLookProbe
        if: steps.release.outputs.exists == 'false'
        shell: pwsh
        run: |
          cmake --install build --config Release --prefix stage/RemoteMouseFix-win-x64
          if ($LASTEXITCODE -ne 0) { throw 'Install failed' }
          Copy-Item build/bin/Release/MouseLookProbe.exe stage/RemoteMouseFix-win-x64/MouseLookProbe.exe
          foreach ($required in @('RemoteMouseFix.exe', 'InputEchoCheck.exe', 'MouseLookProbe.exe', 'RemoteMouseFix.ini', 'Start-Playing.cmd', 'Start-AB-Test.cmd', 'config/config-play.json', 'config/config-ab-test.json', 'README.md', 'LICENSE')) {
            if (-not (Test-Path (Join-Path 'stage/RemoteMouseFix-win-x64' $required))) {
              throw "Missing release file: $required"
            }
          }

      - name: Package and compute SHA-256
        if: steps.release.outputs.exists == 'false'
        shell: pwsh
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          $zip = "RemoteMouseFix-v$env:VERSION-win-x64.zip"
          Compress-Archive -Path 'stage/RemoteMouseFix-win-x64/*' -DestinationPath $zip -CompressionLevel Optimal
          $sha = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          Set-Content -Path "$zip.sha256" -Value "$sha  $zip"
          Write-Host "SHA-256 $sha"
          if (-not (Test-Path $zip) -or -not (Test-Path "$zip.sha256")) {
            throw 'Missing archive or checksum'
          }

      - name: Publish immutable GitHub release
        if: steps.release.outputs.exists == 'false'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          $zip = "RemoteMouseFix-v$env:VERSION-win-x64.zip"
          $notes = "docs/release-notes-v$env:VERSION.md"
          if (Test-Path $notes) {
            gh release create $env:TAG $zip "$zip.sha256" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "RemoteMouseFix $env:TAG" --notes-file $notes --latest
          } else {
            gh release create $env:TAG $zip "$zip.sha256" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "RemoteMouseFix $env:TAG" --generate-notes --latest
          }
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publishing failed' }
